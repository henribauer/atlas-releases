<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 400" role="img" aria-label="Atlas — a study companion for your Obsidian vault">
  <!-- Palette and shapes are Atlas's own tokens (renderer/css/tokens.css):
       bg #F2F2F4, text #1D1D1F/#515156, accent #0A84FF, the orb gradient stack,
       glass fill at .76 alpha with a lighter top rim, one soft card shadow. -->
  <defs>
    <radialGradient id="orbCore" cx="50%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#0B1240"/>
      <stop offset="64%" stop-color="#1B3A9E"/>
      <stop offset="100%" stop-color="#3F86FF"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="16%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#00E0FF" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#00E0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMagenta" cx="90%" cy="60%" r="42%">
      <stop offset="0%" stop-color="#E848D6" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#E848D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbBottomLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="72%" stop-color="#00E0FF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00E0FF" stop-opacity=".4"/>
    </linearGradient>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity=".08"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#000000" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- The board -->
  <rect width="1500" height="400" fill="#F2F2F4"/>
  <rect width="1500" height="400" fill="url(#grid)"/>

  <!-- ===== The agent orb ===== -->
  <circle cx="225" cy="200" r="165" fill="url(#halo)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="158;172;158" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="225" cy="200" r="105" fill="none" stroke="#0A84FF" stroke-width="2">
    <animate attributeName="r" values="105;185" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="225" cy="200" r="105" fill="none" stroke="#0A84FF" stroke-width="2">
    <animate attributeName="r" values="105;185" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="7s" repeatCount="indefinite"/>
    <circle cx="225" cy="200" r="100" fill="url(#orbCore)"/>
    <circle cx="225" cy="200" r="100" fill="url(#orbMagenta)"/>
    <circle cx="225" cy="200" r="100" fill="url(#orbCyan)"/>
    <circle cx="225" cy="200" r="100" fill="url(#orbBottomLight)"/>
    <ellipse cx="178" cy="158" rx="52" ry="26" fill="#FFFFFF" opacity=".65" filter="url(#blurSoft)"/>
    <path d="M 262 238 A 50 50 0 0 0 296 190" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" filter="url(#blurSoft)"/>
    <circle cx="225" cy="200" r="100" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="420" y="188" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="86" font-weight="500" letter-spacing="-1" fill="#1D1D1F">Atlas</text>
  <text x="424" y="236" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-size="27" fill="#515156">A study companion for your Obsidian vault.</text>
  <text x="424" y="284" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="16" fill="#5F5F64">cards · grammar · lectures · voice</text>

  <g opacity="0" transform="translate(0 18)">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 18; 0 0" dur="0.9s" begin="0.4s" fill="freeze"/>
    <g filter="url(#softShadow)">
      <rect x="880" y="82" width="180" height="236" rx="18" fill="#FFFFFF" fill-opacity=".76" stroke="#000000" stroke-opacity=".10"/>
      <rect x="880.5" y="82.5" width="179" height="60" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".9"/>
      <g stroke="#0A84FF" stroke-opacity=".55" stroke-width="3.5" fill="none" stroke-linecap="round">
        <rect x="936" y="142" width="96" height="60" rx="8"/>
        <rect x="948" y="158" width="96" height="60" rx="8"/>
        <line x1="954" y1="164" x2="1014" y2="164"/>
        <line x1="954" y1="180" x2="998" y2="180"/>
      </g>
      <text x="970" y="296" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="20" fill="#3d3d42">Cards</text>
    </g>
  </g>
  <g opacity="0" transform="translate(0 18)">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 18; 0 0" dur="0.9s" begin="0.8s" fill="freeze"/>
    <g filter="url(#softShadow)">
      <rect x="1082" y="82" width="180" height="236" rx="18" fill="#FFFFFF" fill-opacity=".76" stroke="#000000" stroke-opacity=".10"/>
      <rect x="1082.5" y="82.5" width="179" height="60" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".9"/>
      <g stroke="#0A84FF" stroke-opacity=".55" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M 1138 158 v76 l18 -12 18 12 v-76 z"/>
        <line x1="1190" y1="160" x2="1238" y2="160"/>
        <line x1="1190" y1="182" x2="1238" y2="182"/>
        <line x1="1190" y1="204" x2="1224" y2="204"/>
      </g>
      <text x="1172" y="296" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="20" fill="#3d3d42">Lectures</text>
    </g>
  </g>
  <g opacity="0" transform="translate(0 18)">
    <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 18; 0 0" dur="0.9s" begin="1.2s" fill="freeze"/>
    <g filter="url(#softShadow)">
      <rect x="1284" y="82" width="180" height="236" rx="18" fill="#FFFFFF" fill-opacity=".76" stroke="#000000" stroke-opacity=".10"/>
      <rect x="1284.5" y="82.5" width="179" height="60" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".9"/>
      <g stroke="#0A84FF" stroke-opacity=".55" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M 1332 148 h64 a10 10 0 0 1 10 10 v26 a10 10 0 0 1 -10 10 h-40 l-16 16 v-52 a10 10 0 0 1 10 -10 z"/>
        <line x1="1342" y1="164" x2="1390" y2="164"/>
        <line x1="1342" y1="178" x2="1376" y2="178"/>
      </g>
      <text x="1374" y="296" text-anchor="middle" font-family="Newsreader, Georgia, serif" font-size="20" fill="#3d3d42">Conversation</text>
    </g>
  </g>
</svg>